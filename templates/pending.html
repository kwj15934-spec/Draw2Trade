<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>승인 대기 중 - Draw2Trade</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <link rel="preconnect" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg0:#06070A;
      --teal:#5BFFC6;
      --tealGlow:rgba(91,255,198,0.35);
      --fg0:#FAFBFC;
      --fg2:#8C95A8;
    }

    html, body {
      height: 100%; margin: 0;
      background: var(--bg0);
      color: var(--fg0);
      font-family: 'Pretendard Variable','Pretendard',system-ui,-apple-system,sans-serif;
      font-size: 14px;
      overflow: hidden;
    }
    body { position: relative; display: flex; align-items: center; justify-content: center; }

    .bg-overlay {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(70% 60% at 20% 30%, rgba(91,255,198,0.10), transparent 60%),
        radial-gradient(60% 50% at 80% 80%, rgba(91,255,198,0.06), transparent 60%),
        linear-gradient(180deg, rgba(6,7,10,0.55) 0%, rgba(6,7,10,0.4) 40%, rgba(6,7,10,0.7) 100%);
    }
    .bg-grain {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      opacity: .06; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>");
    }

    .card {
      position: relative; z-index: 10;
      width: 440px; max-width: calc(100% - 32px);
      background: rgba(15,18,25,0.55);
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      border-radius: 24px;
      padding: 48px 40px 40px;
      text-align: center;
      box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
      overflow: hidden;
    }
    .card::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.5) 0%,
        rgba(255,255,255,0.18) 25%,
        transparent 50%, transparent 60%,
        rgba(91,255,198,0.18) 80%,
        rgba(91,255,198,0.45) 100%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events: none;
    }

    .brand {
      font-size: 22px; font-weight: 700;
      color: #ff6b35; margin-bottom: 32px;
      letter-spacing: -0.02em;
    }
    .icon { font-size: 48px; margin-bottom: 20px; filter: drop-shadow(0 0 18px var(--tealGlow)); }

    h1 {
      font-size: 18px; font-weight: 600;
      color: var(--fg0); margin: 0 0 12px;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 13px; color: var(--fg2);
      line-height: 1.7; margin: 0 0 32px;
    }

    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,179,91,0.10);
      border: 1px solid rgba(255,179,91,0.35);
      border-radius: 999px;
      padding: 7px 18px;
      font-size: 12px; color: #FFB35B;
      margin-bottom: 32px;
    }
    .dot {
      width: 6px; height: 6px;
      background: #FFB35B; border-radius: 50%;
      box-shadow: 0 0 8px #FFB35B;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .btn-logout {
      display: inline-block;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      color: var(--fg0);
      font-family: inherit; font-size: 13px; font-weight: 500;
      padding: 10px 24px;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, color .18s ease;
    }
    .btn-logout:hover {
      border-color: var(--teal);
      color: var(--teal);
      background: rgba(91,255,198,0.08);
    }

    .footer {
      position: relative; z-index: 10;
      padding: 32px 24px; text-align: center;
      color: rgba(250,251,252,0.45);
      font-size: 12px;
      position: fixed; bottom: 0; left: 0; right: 0;
    }
    .footer a { color: rgba(250,251,252,0.55); text-decoration: none; }
    .footer a:hover { color: var(--teal); }
    .footer p { margin: 0 0 6px; }
  </style>
</head>
<body>
  <div class="bg-overlay"></div>
  <div class="bg-grain"></div>

  <div class="card">
    <div class="brand">Draw2Trade</div>
    <div class="icon">⏳</div>
    <h1>가입 신청이 접수되었습니다</h1>
    <p>
      관리자가 계정을 검토 후 승인해드립니다.<br>
      승인이 완료되면 로그인 페이지에서 접속하실 수 있습니다.
    </p>
    <div class="badge">
      <span class="dot"></span>
      승인 대기 중
    </div>
    <br>
    <button class="btn-logout" id="btn-logout">로그아웃</button>
  </div>

  <footer class="footer">
    <p>
      &copy; 2026 Draw2Trade &nbsp;·&nbsp;
      <a href="/terms">이용약관</a> &nbsp;·&nbsp;
      <a href="/privacy">개인정보 처리방침</a>
    </p>
    <p>본 서비스는 투자 참고 정보를 제공하며, 투자 결과에 대한 책임은 이용자에게 있습니다.</p>
  </footer>

  <script>
    document.getElementById('btn-logout').addEventListener('click', async function() {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login';
    });
  </script>
</body>
</html>

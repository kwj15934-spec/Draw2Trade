<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draw2Trade — 서비스 점검 중</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d14;
      color: #e0e0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 40px 24px;
      max-width: 520px;
    }
    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #7c7cff;
      margin-bottom: 40px;
    }
    .icon {
      font-size: 52px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #f0f0ff;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    p {
      font-size: 14px;
      color: #8888aa;
      line-height: 1.8;
      margin-bottom: 12px;
    }
    .divider {
      width: 40px;
      height: 2px;
      background: #7c7cff44;
      margin: 28px auto;
      border-radius: 2px;
    }
    .status {
      display: inline-block;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 13px;
      color: #6666cc;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Draw2Trade</div>
    <div class="icon">🔧</div>
    <h1>서비스 안정화를 위한<br>긴급 점검 중입니다</h1>
    <p>더 나은 서비스로 곧 돌아오겠습니다.<br>이용에 불편을 드려 죄송합니다.</p>
    <div class="divider"></div>
    <div class="status">잠시 후 다시 접속해 주세요</div>
  </div>
</body>
</html>

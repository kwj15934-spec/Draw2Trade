<html lang="ko">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항 — Draw2Trade</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">

  <style>
    :root{
      --bg0:#06070A;
      --teal:#5BFFC6;
      --teal2:#A8FFE0;
      --tealDim:rgba(91,255,198,0.55);
      --tealGlow:rgba(91,255,198,0.18);
      --orange:#FF9F5B;
      --fg0:#FAFBFC;
      --fg1:rgba(250,251,252,0.78);
      --fg2:rgba(250,251,252,0.55);
      --fg3:rgba(250,251,252,0.35);
      --border1:rgba(255,255,255,0.08);
      --border2:rgba(255,255,255,0.14);
      --font:'Space Grotesk','Pretendard Variable','Pretendard',system-ui,sans-serif;
      --mono:'JetBrains Mono',ui-monospace,monospace;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{margin:0;padding:0;background:var(--bg0);color:var(--fg1);font-family:var(--font);-webkit-font-smoothing:antialiased}
    body{
      min-height:100vh;line-height:1.6;font-size:13px;
      background:
        radial-gradient(ellipse 60% 50% at 30% 10%, rgba(91,255,198,0.06), transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 90%, rgba(91,141,255,0.04), transparent 70%),
        var(--bg0);
    }
    body::before{
      content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
      background-image:
        linear-gradient(rgba(91,255,198,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(91,255,198,0.035) 1px, transparent 1px);
      background-size:48px 48px;
      mask-image:radial-gradient(circle at 50% 30%, #000 30%, transparent 80%);
      -webkit-mask-image:radial-gradient(circle at 50% 30%, #000 30%, transparent 80%);
    }

    /* 네비 */
    /* ── 통일 네비게이션 (base.html 매칭) ─────────── */
    .d2t-nav{
      position:sticky;top:0;z-index:100;height:46px;
      background:rgba(6,7,10,0.72);
      backdrop-filter:blur(18px) saturate(140%);
      -webkit-backdrop-filter:blur(18px) saturate(140%);
      border-bottom:1px solid rgba(255,255,255,0.08);
      display:flex;align-items:center;padding:0 20px;gap:0;
      box-sizing:border-box;
    }
    .d2t-brand{
      font-family:var(--font);font-size:16px;font-weight:800;
      color:#ff6b35;letter-spacing:-0.2px;
      text-decoration:none;display:flex;align-items:center;gap:8px;white-space:nowrap;
      flex-shrink:0;margin-right:16px;
    }
    .d2t-brand img{height:24px;width:24px;object-fit:contain}
    .d2t-nav-sep{width:1px;height:16px;background:#3f3f46;flex-shrink:0;margin:0 20px 0 0}
    .d2t-nav-tabs{display:flex;align-items:center;gap:30px;flex-shrink:0}
    .nav-spacer{flex:1;min-width:0}
    .nav-link{
      font-size:14px;font-weight:500;color:#8C95A8;text-decoration:none;
      background:none;border:none;border-bottom:2px solid transparent;
      padding:0;margin:0;white-space:nowrap;
      transition:color .15s,border-color .15s;
      line-height:46px;display:inline-block;letter-spacing:0;
    }
    .nav-link:hover{color:#C9CFDA;border-bottom-color:#3f3f46}
    .nav-link.active{color:#5BFFC6;border-bottom:2px solid #5BFFC6;font-weight:700}

    /* 페이지 */
    .page-wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:48px 22px 80px}

    .page-label{
      font-size:10px;font-weight:600;letter-spacing:0.18em;
      color:var(--teal);text-transform:uppercase;margin-bottom:12px;
      font-family:var(--mono);
    }
    .page-title{font-size:clamp(28px,4.4vw,40px);font-weight:600;letter-spacing:-0.025em;color:#fff;margin-bottom:10px}
    .page-desc{font-size:13px;color:var(--fg2);margin-bottom:32px}

    /* 필터 */
    .filter-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
    .filter-tab{
      padding:6px 14px;border-radius:999px;font-size:12px;font-weight:500;letter-spacing:0.02em;
      border:1px solid var(--border2);background:rgba(255,255,255,0.03);
      color:var(--fg2);cursor:pointer;font-family:var(--font);
      transition:all .18s ease;
    }
    .filter-tab:hover{border-color:var(--tealDim);color:var(--teal)}
    .filter-tab.active{border-color:var(--tealDim);color:var(--teal);background:rgba(91,255,198,0.08);box-shadow:0 0 16px rgba(91,255,198,0.12)}

    /* 공지 카드 */
    .notices-list{display:flex;flex-direction:column;gap:10px}
    .notice-card{
      position:relative;overflow:hidden;
      background:rgba(255,255,255,0.025);
      border:1px solid var(--border1);
      border-radius:14px;padding:18px 22px;
      transition:border-color .18s ease,transform .15s ease,background .18s ease;
      cursor:pointer;
    }
    .notice-card:hover{border-color:var(--tealDim);transform:translateY(-1px);background:rgba(91,255,198,0.04)}
    .notice-card.pinned{border-color:rgba(91,255,198,0.3);background:rgba(91,255,198,0.04)}

    .notice-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
    .notice-pin{font-size:12px;color:var(--teal);font-weight:600}
    .notice-badge{
      display:inline-block;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:0.04em;
      font-family:var(--mono);
    }
    .badge-update{background:rgba(91,255,198,0.12);color:var(--teal);border:1px solid rgba(91,255,198,0.3)}
    .badge-event{background:rgba(255,159,91,0.12);color:var(--orange);border:1px solid rgba(255,159,91,0.3)}
    .badge-notice{background:rgba(255,255,255,0.06);color:var(--fg2);border:1px solid var(--border2)}

    .notice-title{font-size:15px;font-weight:600;letter-spacing:-0.005em;color:#fff;margin-bottom:5px;line-height:1.4}
    .notice-preview{font-size:12px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:10px;line-height:1.6}
    .notice-footer{display:flex;align-items:center;gap:14px}
    .notice-date{font-size:11px;color:var(--fg3);font-family:var(--mono)}
    .notice-views{font-size:11px;color:var(--fg3);font-family:var(--mono)}

    .notice-thumb{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-bottom:12px;display:block}

    /* 모달 */
    .modal-bg{
      display:none;position:fixed;inset:0;z-index:500;
      background:rgba(6,7,10,0.78);
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      align-items:center;justify-content:center;padding:20px;
    }
    .modal-bg.open{display:flex}
    .modal-box{
      position:relative;overflow:hidden auto;
      background:rgba(15,18,25,0.85);
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      border-radius:18px;width:100%;max-width:680px;max-height:88vh;
      box-shadow:0 30px 80px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.1);
    }
    .modal-box::before{
      content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;
      background:linear-gradient(180deg, rgba(91,255,198,0.5), rgba(91,255,198,0.1) 50%, rgba(91,255,198,0.5));
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
    }
    .modal-img{width:100%;max-height:300px;object-fit:cover;border-radius:18px 18px 0 0;display:none}
    .modal-content{padding:28px 32px 32px;position:relative;z-index:1}
    .modal-close{
      position:absolute;top:14px;right:14px;
      background:rgba(0,0,0,0.4);border:1px solid var(--border2);color:var(--fg1);
      font-size:14px;cursor:pointer;border-radius:50%;
      width:32px;height:32px;display:flex;align-items:center;justify-content:center;
      z-index:10;transition:background .15s ease,color .15s ease;
    }
    .modal-close:hover{background:rgba(91,255,198,0.15);color:var(--teal)}
    .modal-badge-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
    .modal-title{font-size:21px;font-weight:600;letter-spacing:-0.015em;color:#fff;margin-bottom:6px;line-height:1.3}
    .modal-meta{font-size:11px;color:var(--fg3);margin-bottom:20px;font-family:var(--mono);letter-spacing:0.04em}
    .modal-body{font-size:14px;color:var(--fg1);line-height:1.85;white-space:pre-wrap;border-top:1px solid var(--border1);padding-top:18px}

    /* 빈 상태 / 스피너 */
    .empty-state{text-align:center;padding:60px 24px;color:var(--fg2);font-size:13px}
    .n-spinner{width:26px;height:26px;margin:0 auto 12px;border:2px solid rgba(91,255,198,0.12);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* 문의 모달 */
    .contact-modal{
      display:none;position:fixed;inset:0;z-index:999;
      background:rgba(6,7,10,0.78);
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      align-items:center;justify-content:center;padding:20px;
    }
    .contact-modal.open{display:flex}
    .contact-box{
      position:relative;overflow:hidden;
      background:rgba(15,18,25,0.85);
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      border-radius:18px;padding:32px;width:100%;max-width:460px;
      box-shadow:0 30px 80px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.1);
    }
    .contact-box::before{
      content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;
      background:linear-gradient(180deg, rgba(91,255,198,0.5), rgba(91,255,198,0.1) 50%, rgba(91,255,198,0.5));
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
    }
    .contact-title{font-size:18px;font-weight:600;letter-spacing:-0.01em;color:#fff;margin-bottom:6px;position:relative;z-index:1}
    .contact-sub{font-size:12px;color:var(--fg2);margin-bottom:20px;position:relative;z-index:1}
    .form-group{margin-bottom:14px;position:relative;z-index:1}
    .form-label{font-size:10px;color:var(--fg2);display:block;margin-bottom:6px;letter-spacing:0.06em;text-transform:uppercase;font-weight:500}
    .form-input{
      width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--border2);
      border-radius:8px;padding:10px 12px;color:var(--fg0);font-size:13px;outline:none;
      font-family:var(--font);
      transition:border-color .15s ease,background .15s ease,box-shadow .15s ease;
    }
    .form-input:focus{border-color:var(--tealDim);background:rgba(91,255,198,0.04);box-shadow:0 0 0 3px rgba(91,255,198,0.08)}
    .btn-submit{
      width:100%;padding:12px;
      background:linear-gradient(180deg, var(--teal), #4FE6B3);
      border:none;border-radius:10px;
      color:#001810;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);
      transition:transform .15s ease,filter .15s ease;
      box-shadow:0 6px 20px rgba(91,255,198,0.22), inset 0 1px 0 rgba(255,255,255,0.4);
      position:relative;z-index:1;
    }
    .btn-submit:hover{transform:translateY(-1px);filter:brightness(1.05)}
    .btn-submit:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .contact-success{
      display:none;background:rgba(91,255,198,0.1);border:1px solid var(--tealDim);
      border-radius:10px;padding:14px;color:var(--teal);font-size:13px;
      text-align:center;margin-bottom:16px;position:relative;z-index:1;
    }

    footer{
      position:relative;z-index:1;
      padding:36px 24px;text-align:center;color:var(--fg3);font-size:11px;
      border-top:1px solid var(--border1);line-height:1.9;
    }
    footer a{color:var(--fg2);text-decoration:none;transition:color .15s ease}
    footer a:hover{color:var(--teal)}

    @media (max-width:600px){
      .d2t-nav{padding:0 14px;height:44px}
      .d2t-brand{font-size:14px;gap:6px;margin-right:12px}
      .d2t-brand img{height:20px;width:20px}
      .d2t-nav-tabs{gap:18px}
      .d2t-nav-sep{margin:0 12px 0 0}
      .nav-link{font-size:12px;line-height:44px}
      .page-wrap{padding:32px 16px 60px}
    }
  </style>
</head>

<div class="page-wrap">

  <p class="page-desc">Draw2Trade 최신 소식과 서비스 안내를 확인하세요.</p>

  <div class="filter-tabs">
    <button class="filter-tab active" onclick="filterNotices('all', this)">전체</button>
    <button class="filter-tab" onclick="filterNotices('update', this)">업데이트</button>
    <button class="filter-tab" onclick="filterNotices('event', this)">이벤트</button>

  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <img class="modal-img" id="modal-img" src="" alt="">
    <div class="modal-content">
      <div class="modal-badge-row" id="modal-badge"></div>
      <div class="modal-title" id="modal-title"></div>

<!-- ── 문의 모달 ───────────────────────────────── -->
<div class="contact-modal" id="contact-modal" onclick="if(event.target===this)closeContact()">
  <div class="contact-box">
    <button onclick="closeContact()" style="position:absolute;top:14px;right:14px;background:rgba(0,0,0,0.4);border:1px solid var(--border2);color:var(--fg1);font-size:14px;cursor:pointer;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;z-index:10;">✕</button>
    <div class="contact-title">문의하기</div>
    <div class="contact-sub">회신 받을 이메일을 남겨주세요.</div>
    <div class="contact-success" id="contact-success">문의가 접수됐습니다. 빠르게 답변 드리겠습니다.</div>
    <form id="contact-form" onsubmit="submitContact(event)" style="position:relative;z-index:1;">
      <div class="form-group">
        <label class="form-label">이름 (선택)</label>
        <input name="name" type="text" placeholder="홍길동" class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label">이메일 <span style="color:var(--teal);">*</span></label>
        <input name="email" type="email" placeholder="example@email.com" required class="form-input">
      </div>
      <div class="form-group" style="margin-bottom:20px;">
        <label class="form-label">문의 내용 <span style="color:var(--teal);">*</span></label>
        <textarea name="message" rows="4" placeholder="궁금한 점이나 의견을 남겨주세요." required class="form-input" style="resize:vertical;"></textarea>

      <button type="submit" class="btn-submit" id="contact-submit">보내기</button>

<script>
  var allNotices = [];
  var currentFilter = 'all';

  var BADGE = {
    update: '<span class="notice-badge badge-update">업데이트</span>',
    event:  '<span class="notice-badge badge-event">이벤트</span>',
    notice: '<span class="notice-badge badge-notice">공지</span>',
  };

  async function loadNotices() {
    try {
      var res = await fetch('/api/notices');
      allNotices = await res.json();
      render();
    } catch {
      document.getElementById('notices-list').innerHTML =
        '<div class="empty-state">공지사항을 불러올 수 없습니다.</div>';
    }
  }

  function filterNotices(type, el) {
    currentFilter = type;
    document.querySelectorAll('.filter-tab').forEach(function (t) { t.classList.remove('active'); });
    el.classList.add('active');
    render();
  }

  function render() {
    var list = currentFilter === 'all'
      ? allNotices
      : allNotices.filter(function (n) { return n.type === currentFilter; });
    var el = document.getElementById('notices-list');
    if (!list.length) {
      el.innerHTML = '<div class="empty-state">해당 유형의 공지가 없습니다.</div>';
      return;
    }
    el.innerHTML = list.map(function (n) {
      var pin = n.pinned ? '<span class="notice-pin">📌</span>' : '';
      var imgMatch = n.content.match(/\[IMG:(https?:\/\/[^\]]+)\]/);
      var imgHtml  = imgMatch
        ? '<img class="notice-thumb" src="' + escHtml(imgMatch[1]) + '" alt="" onerror="this.style.display=\'none\'">'
        : '';
      var preview  = escHtml(n.content.replace(/\[IMG:[^\]]+\]/g, '').trim().slice(0, 80));

      return '<div class="notice-card' + (n.pinned ? ' pinned' : '') + '" onclick="openModal(' + n.id + ')">' +
        imgHtml +
        '<div class="notice-header">' + pin + (BADGE[n.type] || BADGE.notice) + '</div>' +
        '<div class="notice-title">' + escHtml(n.title) + '</div>' +
        '<div class="notice-preview">' + preview + '</div>' +
        '<div class="notice-footer">' +
          '<span class="notice-date">' + n.date + '</span>' +
          (n.views ? '<span class="notice-views">👁 ' + n.views + '</span>' : '') +
        '</div>' +
      '</div>';
    }).join('');
  }

  async function openModal(id) {
    var n = allNotices.find(function (x) { return x.id === id; });
    if (!n) return;
    _renderModal(n);
    try {
      var res = await fetch('/api/notices/' + id);
      if (res.ok) {
        var fresh = await res.json();
        n.views = fresh.views;
        _renderModal(fresh);
      }
    } catch {}
  }

  function _renderModal(n) {
    var imgMatch = n.content.match(/\[IMG:(https?:\/\/[^\]]+)\]/);
    var imgEl = document.getElementById('modal-img');
    if (imgMatch) {
      imgEl.src = imgMatch[1];
      imgEl.style.display = 'block';
    } else {
      imgEl.style.display = 'none';
      imgEl.src = '';
    }
    document.getElementById('modal-badge').innerHTML = BADGE[n.type] || BADGE.notice;
    document.getElementById('modal-title').textContent = n.title;
    document.getElementById('modal-meta').textContent =
      n.date + (n.views != null ? '  ·  조회 ' + n.views : '');
    document.getElementById('modal-body').textContent =
      n.content.replace(/\[IMG:[^\]]+\]/g, '').trim();
    document.getElementById('notice-modal-bg').classList.add('open');
  }

  function closeModal(e) {
    if (!e || e.target === document.getElementById('notice-modal-bg') || !e.target) {
      document.getElementById('notice-modal-bg').classList.remove('open');
    }
  }

  function openContact() {
    document.getElementById('contact-modal').classList.add('open');
    document.getElementById('contact-success').style.display = 'none';
    document.getElementById('contact-form').style.display = 'block';
    document.getElementById('contact-submit').disabled = false;
  }
  function closeContact() {
    document.getElementById('contact-modal').classList.remove('open');
  }
  async function submitContact(e) {
    e.preventDefault();
    var btn = document.getElementById('contact-submit');
    btn.disabled = true; btn.textContent = '전송 중…';
    var body = new FormData(e.target);
    try {
      var res  = await fetch('/api/contact', { method: 'POST', body: body });
      var data = await res.json();
      if (data.ok) {
        e.target.style.display = 'none';
        document.getElementById('contact-success').style.display = 'block';
        e.target.reset();
      } else {
        btn.disabled = false; btn.textContent = '보내기';
        alert(data.error || '오류가 발생했습니다.');
      }
    } catch {
      btn.disabled = false; btn.textContent = '보내기';
      alert('전송 중 오류가 발생했습니다.');
    }
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  loadNotices();
</script>
</body>
</html>

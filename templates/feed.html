<html lang="ko">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시장 피드 — Draw2Trade</title>
  <meta name="description" content="국내외 시장 지표·인사이트·이슈를 한눈에 정리한 Draw2Trade 시장 피드입니다.">
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg0: #06070A;
      --bg1: #0B0D12;
      --bg2: #11141B;
      --teal: #5BFFC6;
      --tealSoft: rgba(91,255,198,0.12);
      --tealGlow: rgba(91,255,198,0.18);
      --fg0: #FAFBFC;
      --fg1: #C9CFDA;
      --fg2: #8C95A8;
      --fg3: #5A6172;
      --border1: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.04);
      --red: #FF5C7A;
      --font: 'Space Grotesk', 'Pretendard Variable', 'Pretendard', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    html, body {
      min-height: 100%; background: var(--bg0); color: var(--fg1);
      font-family: var(--font); font-size: 14px; line-height: 1.6;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }

    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 600px 400px at 15% 10%, rgba(91,255,198,0.08), transparent 60%),
        radial-gradient(ellipse 500px 350px at 85% 90%, rgba(91,255,198,0.05), transparent 60%),
        linear-gradient(180deg, rgba(91,255,198,0.02) 0%, transparent 30%);
      mask-image: radial-gradient(ellipse 100% 80% at 50% 30%, black 30%, transparent 80%);
    }
    body > * { position: relative; z-index: 1; }

    a { color: inherit; text-decoration: none; }

    /* ── 네비 (통일 — base.html 매칭) ────────────── */
    .d2t-nav {
      position: sticky; top: 0; z-index: 100;
      height: 46px;
      background: rgba(6,7,10,0.72);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center;
      padding: 0 20px; gap: 0;
      box-sizing: border-box;
    }
    .d2t-brand {
      font-family: var(--font); font-size: 16px; font-weight: 800;
      color: #ff6b35; letter-spacing: -0.2px;
      text-decoration: none; display: flex; align-items: center;
      gap: 8px; white-space: nowrap;
      flex-shrink: 0; margin-right: 16px;
    }
    .d2t-brand img { height: 24px; width: 24px; object-fit: contain; }
    .d2t-nav-sep {
      width: 1px; height: 16px; background: #3f3f46;
      flex-shrink: 0; margin: 0 20px 0 0;
    }
    .d2t-nav-tabs {
      display: flex; align-items: center; gap: 30px; flex-shrink: 0;
    }
    .nav-spacer { flex: 1; min-width: 0; }
    .nav-link {
      font-size: 14px; font-weight: 500;
      color: #8C95A8; text-decoration: none;
      background: none; border: none;
      border-bottom: 2px solid transparent;
      padding: 0; margin: 0; white-space: nowrap;
      transition: color .15s, border-color .15s;
      line-height: 46px; display: inline-block;
      letter-spacing: 0;
    }
    .nav-link:hover {
      color: #C9CFDA; text-decoration: none;
      border-bottom-color: #3f3f46;
    }
    .nav-link.active {
      color: #5BFFC6;
      border-bottom: 2px solid #5BFFC6;
      font-weight: 700;
    }

    /* ── 레이아웃 ─────────────────────────────── */
    .page-body {
      max-width: 1180px; margin: 0 auto;
      display: grid; grid-template-columns: 1fr 320px;
      gap: 28px; padding: 36px 24px 80px;
    }
    @media (max-width: 860px) {
      .page-body { grid-template-columns: 1fr; padding: 28px 18px 60px; }
      .feed-sidebar { display: none; }
    }

    .page-header { margin-bottom: 24px; }
    .page-eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--mono); font-size: 11px; font-weight: 500;
      color: var(--teal); letter-spacing: 0.18em; text-transform: uppercase;
      margin-bottom: 12px;
    }
    .page-eyebrow .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--teal); box-shadow: 0 0 10px var(--tealGlow);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
    .page-header h1 {
      font-family: var(--font); font-size: 28px; font-weight: 700;
      color: var(--fg0); letter-spacing: -0.02em; margin-bottom: 6px;
    }
    .page-header p { font-size: 13px; color: var(--fg2); }

    /* ── 피드 카드 그리드 ─────────────────────── */
    .feed-grid {
      display: flex; flex-direction: column; gap: 16px;
    }

    /* ── 인사이트 카드 (liquid-glass) ────────── */
    .insight-card {
      position: relative;
      background: rgba(15,18,25,0.72);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      border-radius: 16px;
      padding: 22px 24px;
      transition: transform .2s ease, border-color .2s ease;
      overflow: hidden;
    }
    .insight-card::before {
      content: ''; position: absolute; inset: 0; border-radius: 16px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
      pointer-events: none;
    }
    .insight-card:hover {
      transform: translateY(-2px);
    }
    .insight-card:hover::before {
      background: linear-gradient(135deg, rgba(91,255,198,0.30), rgba(91,255,198,0.05));
    }

    .ic-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px; margin-bottom: 12px;
    }
    .ic-category {
      font-family: var(--mono); font-size: 10px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--teal);
      background: var(--tealSoft);
      border: 1px solid rgba(91,255,198,0.18);
      padding: 3px 10px; border-radius: 999px;
    }
    .ic-time { font-family: var(--mono); font-size: 11px; color: var(--fg3); white-space: nowrap; }

    .ic-title {
      font-family: var(--font); font-size: 17px; font-weight: 600;
      color: var(--fg0); letter-spacing: -0.01em;
      margin-bottom: 10px; line-height: 1.4;
    }
    .ic-body {
      font-size: 14px; color: var(--fg1); line-height: 1.7;
      margin-bottom: 14px;
    }

    .ic-stats {
      display: flex; gap: 20px; flex-wrap: wrap;
      padding: 12px 0 0;
      border-top: 1px solid var(--border2);
    }
    .ic-stat { display: flex; flex-direction: column; gap: 3px; }
    .ic-stat-label {
      font-family: var(--mono); font-size: 10px; color: var(--fg3);
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .ic-stat-value {
      font-family: var(--mono); font-size: 15px; font-weight: 600;
    }
    .val-up   { color: var(--red); }
    .val-down { color: var(--teal); }
    .val-flat { color: var(--fg0); }

    .ic-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
    .ic-tag {
      font-family: var(--mono); font-size: 10px;
      padding: 4px 10px; border-radius: 999px;
      background: rgba(255,255,255,0.04);
      color: var(--fg2);
      border: 1px solid var(--border1);
      cursor: pointer; transition: color .15s, border-color .15s, background .15s;
    }
    .ic-tag:hover { color: var(--teal); border-color: rgba(91,255,198,0.4); background: var(--tealSoft); }

    /* ── 로딩 / 빈 상태 ──────────────────────── */
    .feed-loading, .feed-empty {
      position: relative;
      background: rgba(15,18,25,0.55);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      border-radius: 16px;
      text-align: center; padding: 80px 24px;
      color: var(--fg2); font-size: 14px; line-height: 1.8;
    }
    .feed-loading::before, .feed-empty::before {
      content: ''; position: absolute; inset: 0; border-radius: 16px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
      pointer-events: none;
    }
    .feed-empty .empty-icon {
      font-size: 36px; margin-bottom: 16px; opacity: 0.7;
    }
    .feed-empty .empty-sub {
      font-size: 12px; color: var(--fg3); margin-top: 8px; display: block;
    }
    .feed-spinner {
      width: 28px; height: 28px; margin: 0 auto 14px;
      border: 2px solid rgba(255,255,255,0.08); border-top-color: var(--teal);
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 사이드바 ─────────────────────────────── */
    .feed-sidebar { display: flex; flex-direction: column; gap: 16px; }

    .sidebar-card {
      position: relative;
      background: rgba(15,18,25,0.72);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      border-radius: 14px;
      padding: 18px;
      overflow: hidden;
    }
    .sidebar-card::before {
      content: ''; position: absolute; inset: 0; border-radius: 14px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
      pointer-events: none;
    }
    .sidebar-card-title {
      font-family: var(--mono); font-size: 11px; font-weight: 600;
      color: var(--fg2);
      letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 14px;
    }

    /* 종목 스크리너 */
    .screener-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 0; border-bottom: 1px solid var(--border2);
      cursor: pointer;
      transition: padding-left .15s ease;
    }
    .screener-row:last-child { border-bottom: none; }
    .screener-row:hover { padding-left: 4px; }
    .screener-row:hover .sc-name { color: var(--teal); }
    .sc-name { font-family: var(--font); font-size: 13px; color: var(--fg0); font-weight: 500; transition: color .15s ease; }
    .sc-code { font-family: var(--mono); font-size: 10px; color: var(--fg3); margin-top: 2px; }
    .sc-pct  { font-family: var(--mono); font-size: 13px; font-weight: 600; }
    .pct-up   { color: var(--red); }
    .pct-down { color: var(--teal); }

    /* 빠른 이동 */
    .quick-link {
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; color: var(--fg1);
      padding: 10px 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border1);
      border-radius: 10px;
      transition: border-color .15s, background .15s, color .15s, transform .15s;
    }
    .quick-link:hover {
      border-color: rgba(91,255,198,0.3);
      background: var(--tealSoft);
      color: var(--teal);
      transform: translateX(2px);
    }
    .quick-link.primary {
      background: var(--tealSoft);
      border-color: rgba(91,255,198,0.25);
      color: var(--teal);
    }
    .quick-link .ql-icon { font-size: 14px; }

    /* ── 푸터 ────────────────────────────────── */
    footer {
      max-width: 1180px; margin: 0 auto;
      padding: 32px 24px;
      border-top: 1px solid var(--border1);
      text-align: center;
      color: var(--fg3); font-size: 12px;
    }
    footer p { margin-bottom: 6px; }
    footer a { color: var(--fg2); transition: color .15s ease; }
    footer a:hover { color: var(--teal); }
    footer .biz { font-family: var(--mono); font-size: 11px; color: var(--fg3); }

    @media (max-width: 600px) {
      .d2t-nav { padding: 0 14px; height: 44px; }
      .d2t-brand { font-size: 14px; gap: 6px; margin-right: 12px; }
      .d2t-brand img { height: 20px; width: 20px; }
      .d2t-nav-tabs { gap: 18px; }
      .d2t-nav-sep { margin: 0 12px 0 0; }
      .nav-link { font-size: 12px; line-height: 44px; }
      .page-header h1 { font-size: 24px; }
    }
  </style>
</head>
<body>

<nav class="d2t-nav">
  <a href="/" class="d2t-brand">
    <img src="/static/img/logo.png" alt="Draw2Trade" onerror="this.src='/static/img/favicon.svg'">
    Draw2Trade
  </a>
  <span class="d2t-nav-sep"></span>
  <div class="d2t-nav-tabs">
    <a href="/market"  class="nav-link">시장</a>
    <a href="/news"    class="nav-link">뉴스</a>
    <a href="/feed"    class="nav-link active">피드</a>
    <a href="/notices" class="nav-link">공지</a>
    <a href="/pricing" class="nav-link">요금제</a>
  </div>
  <div class="nav-spacer"></div>
  <a href="/login" data-loggedin-href="/app" class="nav-link">차트 앱 →</a>
</nav>

<div class="page-body">

  <!-- ── 메인 피드 ──────────────────────────── -->
  <div class="feed-main">
    <div class="page-header">
      <div class="page-eyebrow"><span class="dot"></span>MARKET FEED</div>
      <h1>시장 피드</h1>
      <p>국내외 시장 지표·인사이트·이슈를 한눈에 확인하세요.</p>
    </div>

    <!-- 피드 콘텐츠 -->
    <div class="feed-grid" id="feed-grid">
      <div class="feed-empty">
        <div class="empty-icon">📭</div>
        아직 게시된 피드가 없습니다.
        <span class="empty-sub">곧 업데이트될 예정입니다.</span>
      </div>
    </div>
  </div>

  <!-- ── 사이드바 ───────────────────────────── -->
  <aside class="feed-sidebar">

    <div class="sidebar-card">
      <div class="sidebar-card-title">급등 종목</div>
      <div id="screener-up"></div>
    </div>

    <div class="sidebar-card">
      <div class="sidebar-card-title">급락 종목</div>
      <div id="screener-down"></div>
    </div>

    <div class="sidebar-card">
      <div class="sidebar-card-title">빠른 이동</div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <a href="/login" data-loggedin-href="/app" class="quick-link primary"><span class="ql-icon">📈</span>차트 앱으로</a>
        <a href="/news"    class="quick-link"><span class="ql-icon">📰</span>시장 뉴스</a>
        <a href="/notices" class="quick-link"><span class="ql-icon">📢</span>공지사항</a>
      </div>
    </div>

  </aside>
</div>

<footer>
  <p>
    &copy; 2026 Draw2Trade &nbsp;·&nbsp;
    <a href="/terms">이용약관</a> &nbsp;·&nbsp;
    <a href="/privacy">개인정보 처리방침</a>
  </p>
  <p class="biz">상호: FORMETA &nbsp;|&nbsp; 대표: 김원준 &nbsp;|&nbsp; 사업자: 536-32-01566</p>
</footer>

<script>
(function () {
  'use strict';

  /* ── 스크리너 렌더 ──────────────────────── */
  function renderScreener(elId, items, dir) {
    var el = document.getElementById(elId);
    if (!el) return;
    if (!items || !items.length) {
      el.innerHTML = '<div style="font-size:12px;color:var(--fg3);padding:8px 0;">데이터 없음</div>';
      return;
    }
    el.innerHTML = items.map(function (it) {
      var pct   = it.chg_rate != null ? it.chg_rate : 0;
      var cls   = pct >= 0 ? 'pct-up' : 'pct-down';
      var sign  = pct >= 0 ? '+' : '';
      return '<div class="screener-row" onclick="goChart(\'' + esc(it.symbol||it.code||'') + '\',\'KR\')">' +
        '<div>' +
          '<div class="sc-name">' + esc(it.name||it.symbol||'') + '</div>' +
          '<div class="sc-code">' + esc(it.symbol||it.code||'') + '</div>' +
        '</div>' +
        '<span class="sc-pct ' + cls + '">' + sign + pct.toFixed(2) + '%</span>' +
      '</div>';
    }).join('');
  }

  /* ── 사이드바 스크리너 fetch ─────────────── */
  function loadSidebarScreener() {
    fetch('/api/v1/stock/market/scanner/change-rate?market=KR&limit=20')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        var items = (d && d.items) || [];
        var up   = items.filter(function (i) { return (i.chg_rate||0) > 0; })
                        .sort(function (a,b) { return b.chg_rate - a.chg_rate; }).slice(0, 5);
        var down = items.filter(function (i) { return (i.chg_rate||0) < 0; })
                        .sort(function (a,b) { return a.chg_rate - b.chg_rate; }).slice(0, 5);
        renderScreener('screener-up',   up,   'up');
        renderScreener('screener-down', down, 'down');
      })
      .catch(function () {
        renderScreener('screener-up',   [], 'up');
        renderScreener('screener-down', [], 'down');
      });
  }

  /* ── 유틸 ───────────────────────────────── */
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  window.goChart = function (sym, mkt) {
    if (!sym) return;
    window.location.href = '/app?symbol=' + encodeURIComponent(sym) + '&market=' + (mkt || 'KR');
  };

  /* ── 인증 분기 CTA ──────────────────────── */
  fetch('/api/auth/me', { credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) {
      if (!data || !data.authenticated) return;
      document.querySelectorAll('[data-loggedin-href]').forEach(function (el) {
        var dest = el.getAttribute('data-loggedin-href');
        if (dest) el.setAttribute('href', dest);
      });
    })
    .catch(function () {});

  /* ── 초기화 ─────────────────────────────── */
  loadSidebarScreener();
})();
</script>
</body>
</html>
